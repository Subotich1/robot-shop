# Short, predictable resource names: kps-prometheus, kps-alertmanager, kps-grafana
fullnameOverride: kps

# kube-prometheus-stack: Prometheus, Alertmanager, Grafana, node-exporter, kube-state-metrics
# Secrets (Grafana admin password, Slack webhook) are created by scripts/install.sh, never stored here.

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Dashboards are code: any ConfigMap labelled grafana_dashboard=1 is loaded automatically
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
    - name: Jaeger
      type: jaeger
      uid: jaeger
      access: proxy
      url: http://jaeger.monitoring.svc.cluster.local:16686

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors and PrometheusRules from any Helm release, not just this one
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 7d
    resources:
      requests: { cpu: 200m, memory: 1Gi }
      limits: { memory: 2Gi }

alertmanager:
  alertmanagerSpec:
    # Mounted at /etc/alertmanager/secrets/alertmanager-slack/
    secrets:
      - alertmanager-slack
  config:
    route:
      receiver: "null"
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers: ['alertname = "Watchdog"']
        - receiver: slack
          matchers: ['team = "robot-shop"']
          group_wait: 30s
          repeat_interval: 1h
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/url
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
            text: |-
              {{ range .Alerts }}*{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              Runbook: {{ .Annotations.runbook_url }}
              Dashboard: {{ .Annotations.dashboard }}
              {{ end }}
