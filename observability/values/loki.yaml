# Loki in single-binary mode with local disk: right-sized for a course cluster
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi

# Scalable components off
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Memcached caches request several GB of memory by default: not needed here
chunksCache:
  enabled: false
resultsCache:
  enabled: false

gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
